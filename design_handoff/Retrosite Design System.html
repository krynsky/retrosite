<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Retrosite — Design System</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="tokens.motel.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-mono); }
  .swatch { width: 100%; aspect-ratio: 1.6 / 1; border: 2px solid var(--ink); display:flex; align-items:flex-end; justify-content:flex-start; padding: 8px; }
  .swatch-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .swatch-meta { font-family: var(--font-mono); font-size: 11px; line-height: 1.35; }
  .swatch-name { font-weight: 700; }
  .swatch-hex  { color: var(--ink-mute); }

  .type-row { display: grid; grid-template-columns: 110px 1fr; align-items: baseline; gap: 18px; padding: 14px 0; border-bottom: 1.5px dashed var(--ink); }
  .type-row:last-child { border-bottom: none; }
  .type-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }

  /* Section header inside an artboard */
  .ab-pad { padding: 36px 40px; }
  .ab-title { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 6px; }
  .ab-h    { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.01em; margin: 0 0 4px; }
  .ab-sub  { font-family: var(--font-mono); font-size: 13px; color: var(--ink-mute); margin: 0 0 26px; max-width: 60ch; }

  .card-stock {
    background:
      radial-gradient(1200px 400px at 30% 0%, rgba(255,255,255,.6), transparent 60%),
      var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.014) 0 1px, transparent 1px 3px);
  }

  /* Mock app screenshots */
  .mock-toolbar { display:flex; align-items:center; gap:10px; padding: 10px 14px; border-bottom: 2px solid var(--ink); background: var(--paper-2); }
  .mock-tab { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border: 2px solid var(--ink); background: var(--paper); }
  .mock-tab.active { background: var(--lime); }

  /* Hero specifics */
  .hero-headline { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1.05; letter-spacing: -0.015em; margin: 0; }

  /* Ticket / chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid var(--ink); background: var(--paper);
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    padding: 4px 10px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .chip.lime { background: var(--lime); }
  .chip.pink { background: var(--sticky); }
  .chip.yellow { background: var(--sticky-yellow); }
  .chip.ink { background: var(--ink); color: var(--paper); }

  /* Form bits */
  .legend {
    position: absolute; top: -10px; left: 12px;
    background: var(--paper); padding: 0 6px;
    font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.1em;
  }
  .field {
    position: relative; border: 2.5px solid var(--ink); background: var(--paper);
    padding: 12px 14px; min-height: 44px;
  }

  /* Mock timeline screen */
  .tl-row { display:grid; grid-template-columns: 90px 1fr 90px; gap: 14px; align-items:start; padding: 14px 0; border-bottom: 1.5px dashed var(--ink); }
  .tl-year { font-family: var(--font-display); font-weight: 800; font-size: 22px; }

  /* Subtle sticker tape */
  .tape-strip {
    position: absolute; width: 90px; height: 22px; background: var(--tape);
    border-left: 1px dashed rgba(0,0,0,0.15); border-right: 1px dashed rgba(0,0,0,0.15);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
</style>

<!-- React stack -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
</head>
<body class="paper-bg">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* =============================================================
   Accent palette tweak system
   ============================================================= */
const PALETTES = {
  arcade:      { label:'Arcade Cabinet · 8-bit',     paper:'#1a1530', paper2:'#241c45', primary:'#ffd23a', primaryDeep:'#d8a820', markerBlue:'#3ad6ff', markerPink:'#ff3a8c', ballpoint:'#7adcff', sticky:'#ff3a8c', stickyYellow:'#ffd23a' },
  motel:       { label:'Roadside Motel · Neon',      paper:'#f0e3c8', paper2:'#e3d4b0', primary:'#ff5fa2', primaryDeep:'#d23a7e', markerBlue:'#1e8a9a', markerPink:'#ff5fa2', ballpoint:'#0a4a55', sticky:'#5ed3d8', stickyYellow:'#ffe488' },
  zine:        { label:'Photocopy Zine · Risograph', paper:'#f2eddf', paper2:'#e3ddc8', primary:'#3a4cd6', primaryDeep:'#2530a8', markerBlue:'#3a4cd6', markerPink:'#e8482a', ballpoint:'#1a1f4a', sticky:'#ffb650', stickyYellow:'#fff088' },
  postcard:    { label:'Linen Postcard · 1940',      paper:'#ecdfb8', paper2:'#dccd9e', primary:'#5a8d6a', primaryDeep:'#3d6a4a', markerBlue:'#3a4d8a', markerPink:'#c44a3c', ballpoint:'#2a3560', sticky:'#e8a878', stickyYellow:'#e6cd6a' },
  bowling:     { label:'Bowling Alley · Splatter',   paper:'#1f2540', paper2:'#2a3052', primary:'#ff8a3a', primaryDeep:'#d8682a', markerBlue:'#5fbcff', markerPink:'#ff5fa8', ballpoint:'#a8d8ff', sticky:'#ffe06a', stickyYellow:'#a0e85a' },
  craft:       { label:'Craft Paper · Earthen',      paper:'#d8c4a0', paper2:'#c8b48c', primary:'#7a8c3a', primaryDeep:'#5a6c20', markerBlue:'#3a4530', markerPink:'#a85838', ballpoint:'#2a2820', sticky:'#d89870', stickyYellow:'#c8b070' },
  matchbook:   { label:'Matchbook · Tobacco',        paper:'#e8dcc0', paper2:'#dccda8', primary:'#c43830', primaryDeep:'#9a2820', markerBlue:'#5a3d20', markerPink:'#c43830', ballpoint:'#2e1f10', sticky:'#e8b070', stickyYellow:'#e0c870' },
  blueprint:   { label:'Blueprint · Drafting',       paper:'#1f4a78', paper2:'#2a5a8a', primary:'#f4ecd8', primaryDeep:'#dccd9e', markerBlue:'#a8d4ff', markerPink:'#ff8a8a', ballpoint:'#d8e8f8', sticky:'#ffd870', stickyYellow:'#fff088' },
  dustjacket:  { label:'Dust Jacket · 1962',         paper:'#e6d8b0', paper2:'#d8c898', primary:'#d87838', primaryDeep:'#a85820', markerBlue:'#2a4a3d', markerPink:'#a8382a', ballpoint:'#1a2e25', sticky:'#e8b870', stickyYellow:'#dcc878' },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "motel",
  "primaryOverride": "",
  "markerBlueOverride": "",
  "markerPinkOverride": "",
  "paperOverride": "",
  "useOverrides": false
}/*EDITMODE-END*/;

// Encode an SVG underline data URL with the supplied stroke color
function markerSvg(color, variant) {
  const enc = encodeURIComponent(color);
  if (variant === 'double') {
    return (
      `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14' preserveAspectRatio='none'><path d='M2 4 C 50 1, 110 9, 198 5' stroke='${enc}' stroke-width='2.4' stroke-linecap='round' fill='none'/></svg>"),` +
      `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14' preserveAspectRatio='none'><path d='M2 8 C 60 4, 130 12, 198 7' stroke='${enc}' stroke-width='2.4' stroke-linecap='round' fill='none'/></svg>")`
    );
  }
  return `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14' preserveAspectRatio='none'><path d='M2 7 C 40 2, 80 12, 130 6 S 195 4, 198 8' stroke='${enc}' stroke-width='3' stroke-linecap='round' fill='none'/></svg>")`;
}

function PaletteSwatchRow({ palette }) {
  const p = PALETTES[palette];
  if (!p) return null;
  const dots = [p.paper, p.primary, p.markerBlue, p.markerPink, p.ballpoint, p.sticky];
  return (
    <span style={{ display:'inline-flex', gap: 4 }}>
      {dots.map((c, i) => (
        <span key={i} style={{ width: 14, height: 14, background: c, border: '1.5px solid var(--ink)' }} />
      ))}
    </span>
  );
}

function ApplyPalette({ tweaks }) {
  const css = useMemo(() => {
    const base = PALETTES[tweaks.palette] || PALETTES.arcade;
    const primary      = (tweaks.useOverrides && tweaks.primaryOverride)      || base.primary;
    const markerBlue   = (tweaks.useOverrides && tweaks.markerBlueOverride)   || base.markerBlue;
    const markerPink   = (tweaks.useOverrides && tweaks.markerPinkOverride)   || base.markerPink;
    const paper        = (tweaks.useOverrides && tweaks.paperOverride)        || base.paper;
    const paper2 = base.paper2;
    return `
      :root {
        --paper: ${paper};
        --paper-2: ${paper2};
        --lime: ${primary};
        --lime-deep: ${base.primaryDeep};
        --marker-blue: ${markerBlue};
        --marker-pink: ${markerPink};
        --ballpoint: ${base.ballpoint};
        --ballpoint-2: ${base.ballpoint};
        --sticky: ${base.sticky};
        --sticky-yellow: ${base.stickyYellow};
      }
      body, .paper-bg { background-color: ${paper}; }
      .u-marker        { background-image: ${markerSvg(markerBlue)}; }
      .u-marker-pink   { background-image: ${markerSvg(markerPink)}; }
      .u-marker-double { background-image: ${markerSvg(markerBlue, 'double')}; }
    `;
  }, [tweaks]);
  return <style>{css}</style>;
}

function RetrositeTweaks({ tweaks, setTweak }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Palette">
        <TweakSelect
          label="Preset"
          value={tweaks.palette}
          onChange={(v) => setTweak('palette', v)}
          options={Object.entries(PALETTES).map(([k, v]) => ({ value: k, label: v.label }))}
        />
        <div style={{ display:'flex', flexWrap:'wrap', gap: 6, marginTop: 8 }}>
          {Object.entries(PALETTES).map(([k, p]) => (
            <button
              key={k}
              onClick={() => setTweak('palette', k)}
              title={p.label}
              style={{
                display:'flex', alignItems:'center', gap: 6,
                padding: '4px 6px',
                border: tweaks.palette === k ? '2px solid #161412' : '1px solid #999',
                background: tweaks.palette === k ? '#fff' : '#f4f4f4',
                cursor:'pointer', fontFamily:'inherit', fontSize: 11,
              }}
            >
              <PaletteSwatchRow palette={k} />
            </button>
          ))}
        </div>
      </TweakSection>

      <TweakSection title="Custom overrides">
        <TweakToggle
          label="Use custom colors"
          value={tweaks.useOverrides}
          onChange={(v) => setTweak('useOverrides', v)}
        />
        {tweaks.useOverrides && (
          <>
            <TweakColor
              label="Primary (lime)"
              value={tweaks.primaryOverride || PALETTES[tweaks.palette].primary}
              onChange={(v) => setTweak('primaryOverride', v)}
            />
            <TweakColor
              label="Marker blue"
              value={tweaks.markerBlueOverride || PALETTES[tweaks.palette].markerBlue}
              onChange={(v) => setTweak('markerBlueOverride', v)}
            />
            <TweakColor
              label="Marker pink"
              value={tweaks.markerPinkOverride || PALETTES[tweaks.palette].markerPink}
              onChange={(v) => setTweak('markerPinkOverride', v)}
            />
            <TweakColor
              label="Paper"
              value={tweaks.paperOverride || PALETTES[tweaks.palette].paper}
              onChange={(v) => setTweak('paperOverride', v)}
            />
            <TweakButton
              onClick={() => setTweak({ primaryOverride: '', markerBlueOverride: '', markerPinkOverride: '', paperOverride: '' })}
            >Reset overrides</TweakButton>
          </>
        )}
      </TweakSection>
    </TweaksPanel>
  );
}

/* =============================================================
   ARTBOARD: The system at a glance
   ============================================================= */
function ArtboardOverview() {
  return (
    <div className="ab-pad card-stock" style={{ width: 1280 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: 28 }}>
        <Logo size={48} />
        <div style={{ display:'flex', gap: 10 }}>
          <Sticker tone="pink" rotate={-4}>Demo</Sticker>
          <Sticker tone="yellow" rotate={3}>v1.0</Sticker>
        </div>
      </div>
      <h1 className="hero-headline">
        A <span className="u-marker">scrapbook</span> system for<br/>
        a website that remembers <span className="u-marker-pink">the past</span>.
      </h1>
      <p style={{ fontFamily:'var(--font-mono)', fontSize: 16, color:'var(--ink-soft)', marginTop: 18, maxWidth: '64ch' }}>
        Retrosite is a personal archive tool. Its visual language is built from things you find in
        a desk drawer: cream paper, blue ballpoint, masking tape, a polaroid, a sticky note,
        and a 12-pixel icon set. Type is monospace. Buttons are stamped.
      </p>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 18, marginTop: 32 }}>
        {[
          { tag:'TYPE',   title:'Mono + Hand', body:'Display in JetBrains Mono. Marker accents in Caveat. Pixel chrome in VT323.' },
          { tag:'COLOR',  title:'Paper & ink', body:'Cream page, warm black ink. Ballpoint blue and highlighter pink for marks.' },
          { tag:'MOTION', title:'Press, no glide', body:'Buttons translate 2px on press. Stickers don’t bounce. Paper doesn’t slide.' },
          { tag:'SHAPE',  title:'Square first', body:'Hard 90° corners. Hairline rules. Dashed dividers. Pixel grids on icons.' },
        ].map((c,i) => (
          <div key={i} style={{ border: '2px solid var(--ink)', padding: 16, background: 'rgba(255,255,255,0.4)' }}>
            <div className="chip" style={{ marginBottom: 10 }}>{c.tag}</div>
            <div style={{ fontFamily:'var(--font-display)', fontWeight:800, fontSize: 18, marginBottom: 6 }}>{c.title}</div>
            <div style={{ fontFamily:'var(--font-mono)', fontSize: 13, color:'var(--ink-soft)', lineHeight: 1.5 }}>{c.body}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =============================================================
   ARTBOARD: Color
   ============================================================= */
function ArtboardColor() {
  const groups = [
    {
      title: 'Paper',
      sub: 'Backgrounds. Always slightly warm; never pure white.',
      items: [
        { name: 'Paper',      hex: '#F4ECD8', var: '--paper',     fg: 'var(--ink)' },
        { name: 'Paper 2',    hex: '#ECE2C8', var: '--paper-2',   fg: 'var(--ink)' },
        { name: 'Manila',     hex: '#E8D9B0', var: '--manila',    fg: 'var(--ink)' },
        { name: 'Paper Edge', hex: '#D8CAA3', var: '--paper-edge',fg: 'var(--ink)' },
        { name: 'Aged',       hex: '#C9B88A', var: '--paper-deep',fg: 'var(--ink)' },
        { name: 'Tape',       hex: '#DCD2AF', var: '--tape',      fg: 'var(--ink)' },
      ],
    },
    {
      title: 'Ink',
      sub: 'Text and structural strokes. Warm-black, not pure #000.',
      items: [
        { name: 'Ink',       hex: '#161412', var: '--ink',      fg: 'var(--paper)' },
        { name: 'Ink Soft',  hex: '#2A251F', var: '--ink-soft', fg: 'var(--paper)' },
        { name: 'Ink Mute',  hex: '#6B6354', var: '--ink-mute', fg: 'var(--paper)' },
        { name: 'Ink Faint', hex: '#9A917E', var: '--ink-faint',fg: 'var(--ink)' },
      ],
    },
    {
      title: 'Marker',
      sub: 'Pen marks. Ballpoint blue is primary; pink is secondary highlight.',
      items: [
        { name: 'Ballpoint',   hex: '#1D4ED8', var: '--ballpoint',   fg: 'var(--paper)' },
        { name: 'Marker Blue', hex: '#2B6DF0', var: '--marker-blue', fg: 'var(--paper)' },
        { name: 'Marker Pink', hex: '#FF5D8F', var: '--marker-pink', fg: 'var(--ink)' },
        { name: 'Marker Red',  hex: '#D83A3A', var: '--marker-red',  fg: 'var(--paper)' },
      ],
    },
    {
      title: 'Sticker',
      sub: 'Reserved for affordances. Lime = primary action only.',
      items: [
        { name: 'Lime',          hex: '#BFF44A', var: '--lime',          fg: 'var(--ink)' },
        { name: 'Lime Deep',     hex: '#9AD431', var: '--lime-deep',     fg: 'var(--ink)' },
        { name: 'Sticky Pink',   hex: '#FFB6C8', var: '--sticky',        fg: 'var(--ink)' },
        { name: 'Sticky Yellow', hex: '#FFF27A', var: '--sticky-yellow', fg: 'var(--ink)' },
      ],
    },
  ];

  return (
    <div className="ab-pad card-stock" style={{ width: 1280 }}>
      <div className="ab-title">Color</div>
      <h2 className="ab-h">Paper, ink, marker, sticker.</h2>
      <p className="ab-sub">
        Four roles. Paper is structural; ink carries meaning; markers annotate; stickers signal action or status.
        Never use a sticker color for body text or a marker color for fills.
      </p>

      {groups.map((g) => (
        <div key={g.title} style={{ marginBottom: 30 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap: 14, marginBottom: 12 }}>
            <div style={{ fontFamily:'var(--font-display)', fontWeight: 800, fontSize: 18 }}>{g.title}</div>
            <div style={{ fontFamily:'var(--font-mono)', fontSize: 12, color:'var(--ink-mute)' }}>{g.sub}</div>
          </div>
          <div className="swatch-row">
            {g.items.map((s) => (
              <div key={s.name}>
                <div className="swatch" style={{ background: s.hex, color: s.fg }}>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize: 11, fontWeight: 700, letterSpacing:'.06em' }}>
                    {s.var}
                  </div>
                </div>
                <div className="swatch-meta" style={{ marginTop: 6 }}>
                  <div className="swatch-name">{s.name}</div>
                  <div className="swatch-hex">{s.hex}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* =============================================================
   ARTBOARD: Type
   ============================================================= */
function ArtboardType() {
  const rows = [
    { label: 'D1 / 64', cls: 't-display', size: 64,  body: <>Create a <span className="u-marker">timeline</span> of any site.</> },
    { label: 'D2 / 48', cls: 't-display', size: 48,  body: <>Recover the web you remember.</> },
    { label: 'H1 / 28', cls: 't-display', size: 28,  body: <>February 14, 2007 — first capture</> },
    { label: 'H2 / 22', cls: 't-display', size: 22,  body: <>17 snapshots between 2006 and 2014</> },
    { label: 'Body / 15', cls: 't-mono', size: 15, body: <>Retrosite gathers every available capture from the Wayback Machine and arranges them on a vertical timeline.</> },
    { label: 'Mono / 13', cls: 't-mono', size: 13, body: <>USAGE / api.retrosite.test/v1/timelines</> },
    { label: 'Pixel / 24', cls: 't-pixel', size: 18, body: <>SYSTEM READY — DRIVE A: 1.44MB</> },
    { label: 'Hand / 36', cls: 't-hand', size: 36, body: <>2007 vibes ✏︎</> },
  ];

  return (
    <div className="ab-pad card-stock" style={{ width: 1280 }}>
      <div className="ab-title">Type</div>
      <h2 className="ab-h">Mono for structure. Hand for soul.</h2>
      <p className="ab-sub">
        Display and UI use a single monospaced family — JetBrains Mono — at multiple weights. Caveat handles
        all human marks: captions, underlines, scribbled notes. VT323 is reserved for chrome that pretends to
        be a terminal. Three families, no more.
      </p>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: 36 }}>
        <div>
          {rows.map((r) => (
            <div className="type-row" key={r.label}>
              <div className="type-label">{r.label}</div>
              <div className={r.cls} style={{ fontSize: r.size }}>{r.body}</div>
            </div>
          ))}
        </div>

        <div>
          <div style={{ border: '2px solid var(--ink)', padding: 22, background: 'rgba(255,255,255,0.45)' }}>
            <div className="ab-title">Pairing rules</div>
            <ul style={{ fontFamily:'var(--font-mono)', fontSize: 13, lineHeight: 1.7, paddingLeft: 18, margin: '8px 0 18px' }}>
              <li>Display headlines always set tight: tracking <code>-0.01em</code>, leading <code>1.05</code>.</li>
              <li>Body copy stays at 15px / 1.55. Never below 13px in product UI.</li>
              <li>One marker underline per headline maximum. Two adjacent looks accidental.</li>
              <li>Caveat is for humans only — never label form inputs or buttons with it.</li>
              <li>VT323 reserved for status bars, log lines, and the boot stripe.</li>
            </ul>
            <div className="ab-title" style={{ marginTop: 14 }}>Specimen</div>
            <div style={{ fontFamily:'var(--font-display)', fontSize: 90, fontWeight: 800, letterSpacing: '-0.02em', lineHeight: 1 }}>Aa</div>
            <div style={{ fontFamily:'var(--font-mono)', fontSize: 12, color:'var(--ink-mute)', marginTop: 6 }}>JetBrains Mono · 800</div>
            <div style={{ display:'grid', gridTemplateColumns: 'repeat(13, 1fr)', gap: 4, marginTop: 14, fontFamily:'var(--font-display)', fontSize: 18 }}>
              {'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('').map((ch, i) => (
                <div key={i} style={{ border:'1px solid var(--ink)', padding: '6px 0', textAlign:'center' }}>{ch}</div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =============================================================
   ARTBOARD: Iconography (pixel)
   ============================================================= */
function ArtboardIcons() {
  const items = [
    { name: 'computer', label: 'Computer' },

        <div style={{ borderRight: '1.5px dashed var(--ink)', padding: '22px 18px' }}>
          <div className="ab-title">Range</div>
          <div style={{ display:'flex', flexDirection:'column', gap: 10, marginTop: 10 }}>
            <div className="field"><span className="legend">FROM</span><div style={{ fontFamily:'var(--font-mono)', fontSize: 16 }}>2006</div></div>
            <div className="field"><span className="legend">TO</span><div style={{ fontFamily:'var(--font-mono)', fontSize: 16 }}>2014</div></div>
          </div>
          <div className="ab-title" style={{ marginTop: 24 }}>Filters</div>
          <div style={{ display:'flex', flexDirection:'column', gap: 8, marginTop: 10, fontFamily:'var(--font-mono)', fontSize: 13 }}>
            <Check label="Major redesigns" on />
            <Check label="Favicon changes" on />
            <Check label="Subdomains" />
            <Check label="Mobile captures" />
          </div>
          <div className="ab-title" style={{ marginTop: 24 }}>Pinned</div>
          <div style={{ marginTop: 10, display:'flex', flexDirection:'column', gap: 10 }}>
            <PinnedItem label="2007-03-14" tone="pink" />
            <PinnedItem label="2009-08-02" tone="yellow" />
            <PinnedItem label="2014-11-02" tone="lime" />
          </div>
        </div>

        {/* Timeline */}
        <div style={{ padding: '28px 32px' }}>
          <h2 className="ab-h" style={{ fontSize: 30 }}>example.test, <span className="u-marker">2006 → 2014</span></h2>
          <p style={{ fontFamily:'var(--font-mono)', fontSize: 13, color:'var(--ink-mute)', margin:'4px 0 22px' }}>
            17 captures across 8 years. Click any capture to open in archive viewer.
          </p>

          {captures.map((c, i) => (
            <div className="tl-row" key={c.year}>
              <div>
                <div className="tl-year">{c.year}</div>
                <div style={{ fontFamily:'var(--font-mono)', fontSize: 11, color:'var(--ink-mute)' }}>{c.count} captures</div>
              </div>
              <div>
                <div style={{ fontFamily:'var(--font-display)', fontWeight: 700, fontSize: 16 }}>
                  {c.blurb}
                </div>
                <div style={{ display:'flex', gap: 10, marginTop: 12, flexWrap:'wrap' }}>
                  {Array.from({ length: c.count }).map((_, j) => (
                    <div key={j} style={{ width: 110, border:'1px solid #c9b88a', background:'#fbf6e6', padding: 6, boxShadow:'2px 2px 0 0 rgba(0,0,0,.05)' }}>
                      <div style={{ height: 64, background: `repeating-linear-gradient(${(j*40)}deg, #d8dfe5 0 8px, #cfd6dc 8px 16px)` }} />
                      <div style={{ fontFamily:'var(--font-mono)', fontSize: 9, marginTop: 4, color:'var(--ink-mute)' }}>
                        {c.year}-{String((j+1)*3).padStart(2,'0')}-1{j}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ textAlign:'right' }}>
                {i === 1 && <Sticker tone="pink" rotate={-6}>Notable</Sticker>}
                {i === 3 && <Sticker tone="yellow" rotate={4}>Rebrand</Sticker>}
                {i === 4 && <Sticker tone="lime" rotate={-3}>Final</Sticker>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Check({ label, on }) {
  return (
    <label style={{ display:'flex', alignItems:'center', gap: 8 }}>
      <span style={{ width: 16, height: 16, border:'2px solid var(--ink)', background:'var(--paper)', position:'relative' }}>
        {on && <span style={{ position:'absolute', inset: 2, background:'var(--ink)' }} />}
      </span>
      {label}
    </label>
  );
}
function PinnedItem({ label, tone }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap: 10 }}>
      <Sticker tone={tone} rotate={-4} style={{ fontSize: 10, padding:'2px 6px' }}>★</Sticker>
      <span style={{ fontFamily:'var(--font-mono)', fontSize: 12 }}>{label}</span>
    </div>
  );
}

/* =============================================================
   ARTBOARD: Mobile
   ============================================================= */
function ArtboardMobile() {
  return (
    <div style={{ width: 1280, padding: '36px 40px' }} className="card-stock">
      <div className="ab-title">App / Mobile</div>
      <h2 className="ab-h">Pocket-sized archive.</h2>
      <p className="ab-sub">
        The mobile app keeps the same vocabulary in tighter quarters. Stickers shrink. Polaroids stack. The
        primary action stays lime.
      </p>
      <div style={{ display:'flex', gap: 36, justifyContent:'center', marginTop: 24 }}>
        <Phone>
          <PhoneHome />
        </Phone>
        <Phone>
          <PhoneTimeline />
        </Phone>
        <Phone>
          <PhoneCapture />
        </Phone>
      </div>
    </div>
  );
}

function Phone({ children }) {
  return (
    <div style={{
      width: 280, height: 580, borderRadius: 32, background:'var(--ink)',
      padding: 8, boxShadow:'10px 10px 0 0 rgba(0,0,0,.18)',
    }}>
      <div style={{
        width: '100%', height: '100%', borderRadius: 24, overflow:'hidden',
        background:'var(--paper)', position:'relative',
      }} className="paper-bg">
        <div style={{ position:'absolute', top: 6, left: '50%', transform:'translateX(-50%)', width: 90, height: 18, background:'var(--ink)', borderRadius: 12, zIndex: 5 }} />
        <div style={{ position:'absolute', inset: 0, paddingTop: 32 }}>{children}</div>
      </div>
    </div>
  );
}

function PhoneHome() {
  return (
    <div style={{ padding: '14px 16px', height: '100%', display:'flex', flexDirection:'column' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <Logo size={20} />
        <Sticker tone="pink" rotate={-6} style={{ fontSize: 9, padding:'2px 6px' }}>Demo</Sticker>
      </div>
      <div style={{ marginTop: 24, fontFamily:'var(--font-display)', fontWeight: 800, fontSize: 26, lineHeight: 1.05 }}>
        Make a <span className="u-marker">timeline</span> from any URL.
      </div>
      <div style={{ marginTop: 20 }}>
        <DomainField label="DOMAIN" />
      </div>
      <div style={{ marginTop: 14 }}>
        <StampButton tone="lime" size="md" icon={<PixelIcon name="arrow" size={14} />} style={{ width: '100%', justifyContent:'center' }}>
          Create Timeline
        </StampButton>
      </div>
      <div style={{ marginTop: 'auto' }}>
        <div className="ab-title" style={{ fontSize: 10 }}>Recent</div>
        <div style={{ display:'flex', flexDirection:'column', gap: 8, marginTop: 8 }}>
          {['example.test','old.shop','journal.test'].map((d) => (
            <div key={d} style={{ display:'flex', justifyContent:'space-between', border:'1.5px dashed var(--ink)', padding:'8px 10px', fontFamily:'var(--font-mono)', fontSize: 12 }}>
              <span>{d}</span>
              <span style={{ color:'var(--ink-mute)' }}>17</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function PhoneTimeline() {
  return (
    <div style={{ padding: '12px 14px', height: '100%' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <span className="chip ink" style={{ fontSize: 10 }}>example.test</span>
        <PixelIcon name="folder" size={18} />
      </div>
      <div style={{ marginTop: 12, fontFamily:'var(--font-display)', fontWeight: 800, fontSize: 20 }}>
        2006 → <span className="u-marker">2014</span>
      </div>
      <div style={{ marginTop: 10, display:'flex', flexDirection:'column', gap: 10 }}>
        {[
          { y: 2006, t:'Static HTML, table layout.', tone:null },
          { y: 2007, t:'Sidebar redesign.', tone:'pink' },
          { y: 2009, t:'Helvetica everywhere.', tone:null },
          { y: 2011, t:'Rebrand to white.', tone:'yellow' },
          { y: 2014, t:'Final capture.', tone:'lime' },
        ].map((c) => (
          <div key={c.y} style={{ display:'grid', gridTemplateColumns:'40px 1fr auto', gap: 8, alignItems:'center', borderBottom: '1.5px dashed var(--ink)', paddingBottom: 8 }}>
            <div style={{ fontFamily:'var(--font-display)', fontWeight: 800, fontSize: 18 }}>{`'${String(c.y).slice(2)}`}</div>
            <div style={{ fontFamily:'var(--font-mono)', fontSize: 11 }}>{c.t}</div>
            {c.tone && <Sticker tone={c.tone} rotate={-4} style={{ fontSize: 9, padding:'1px 5px' }}>★</Sticker>}
          </div>
        ))}
      </div>
    </div>
  );
}

function PhoneCapture() {
  return (
    <div style={{ padding: '12px 14px', height: '100%' }}>
      <div className="chip ink" style={{ fontSize: 10 }}>2007-03-14</div>
      <div style={{ marginTop: 10, fontFamily:'var(--font-display)', fontWeight: 800, fontSize: 18 }}>
        Sidebar <span className="u-marker-pink">redesign</span>
      </div>
      <div style={{ marginTop: 12 }}>
        <Polaroid caption="march '07" rotate={-1.5} width={220} tape={false}>
          <MockBrowser />
        </Polaroid>
      </div>
      <div style={{ marginTop: 18, fontFamily:'var(--font-mono)', fontSize: 11, color:'var(--ink-soft)', lineHeight: 1.5 }}>
        Sidebar moved from right to left. Favicon switched to a blue globe.
        New “What's new” module added below the masthead.
      </div>
      <div style={{ marginTop: 14, display:'flex', gap: 8 }}>
        <StampButton tone="lime" size="sm" style={{ flex:1, justifyContent:'center' }}>Open</StampButton>
        <StampButton tone="paper" size="sm" style={{ flex:1, justifyContent:'center' }}>Pin</StampButton>
      </div>
    </div>
  );
}

/* =============================================================
   App root
   ============================================================= */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <>
      <ApplyPalette tweaks={tweaks} />
      <RetrositeTweaks tweaks={tweaks} setTweak={setTweak} />
      <DesignCanvas title="Retrosite — Design System" subtitle="Digital scrapbook · paper, ink, marker, sticker">
      <DCSection id="foundations" title="Foundations">
        <DCArtboard id="overview" label="System overview" width={1280} height={520}><ArtboardOverview /></DCArtboard>
        <DCArtboard id="color"    label="Color"           width={1280} height={1040}><ArtboardColor /></DCArtboard>
        <DCArtboard id="type"     label="Typography"      width={1280} height={920}><ArtboardType /></DCArtboard>
        <DCArtboard id="scale"    label="Scale & shadows" width={1280} height={620}><ArtboardScale /></DCArtboard>
      </DCSection>

      <DCSection id="components" title="Components">
        <DCArtboard id="icons"    label="Pixel icons"        width={1280} height={620}><ArtboardIcons /></DCArtboard>
        <DCArtboard id="controls" label="Buttons & inputs"   width={1280} height={720}><ArtboardControls /></DCArtboard>
        <DCArtboard id="cards"    label="Cards & polaroids"  width={1280} height={920}><ArtboardCards /></DCArtboard>
        <DCArtboard id="marks"    label="Hand marks"         width={1280} height={520}><ArtboardMarks /></DCArtboard>
      </DCSection>

      <DCSection id="surfaces" title="Surfaces in use">
        <DCArtboard id="web"    label="Marketing site — landing"  width={1280} height={760}><ArtboardWeb /></DCArtboard>
        <DCArtboard id="app"    label="Web app — timeline view"   width={1280} height={920}><ArtboardApp /></DCArtboard>
        <DCArtboard id="mobile" label="Mobile app — three states" width={1280} height={780}><ArtboardMobile /></DCArtboard>
      </DCSection>
      </DesignCanvas>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
